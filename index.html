<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MattBid</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --muted: #667085; --line: #e3e6ea;
    --front: #4a90e2; --back: #4caf50; --double: #ff9800; --none: #ffd54f; --rsv: #b0b8c4; --mid: #9b6bd6;
    --off: #fde2e4; --wknd: #f0f2f5; --sel: #e8f0fe; --hdr: 52px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  button, select, input { font: inherit; }
  button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  #dhCity { width: 5em; text-transform: uppercase; }
  #month:empty { display: none; }
  main { display: grid; gap: 12px; padding: 12px; }
  #selPanel[hidden] { display: none; }
  #selHead { display: contents; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  h2 { font-size: 14px; margin: 0 0 6px; color: var(--muted); }
  #empty { padding: 40px; text-align: center; color: var(--muted); }

  /* line rows */
  .row { display: grid; grid-template-columns: 6.5em 1fr; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
  .row.head { position: sticky; top: var(--hdr); background: var(--panel); z-index: 2; border-top: 0; }
  .meta { font-size: 12px; line-height: 1.2; }
  .meta b { font-size: 13px; }
  .meta small { color: var(--muted); display: block; }
  .row input[type=checkbox] { width: 18px; height: 18px; margin: 0 6px 0 0; vertical-align: -3px; }

  /* calendar bar */
  .bar { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); min-height: 42px; position: relative; }
  .bar .d { grid-row: 1; border-left: 1px solid var(--line); background: #fff; }
  .bar .d.wknd { background: var(--wknd); }
  .bar .d.off { background: var(--off); }
  .head .bar { min-height: 22px; }
  .head .d { font-size: 10px; text-align: center; color: var(--muted); cursor: pointer; user-select: none; line-height: 22px; overflow: hidden; }
  .head .d.off { background: var(--off); color: #b42318; font-weight: 600; }
  .head .d.pend { box-shadow: inset 0 -2px 0 var(--muted); }
  .trip { grid-row: 1; margin: 3px 0; border-radius: 6px; font-size: 10px; line-height: 17px; cursor: pointer; overflow: hidden; position: relative; padding: 1px 0; }
  .trip .t1 { padding: 0 4px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .trip .t2 { display: grid; grid-template-columns: repeat(var(--w), minmax(0, 1fr)); text-align: center; }
  .trip .t2 span { overflow: hidden; white-space: nowrap; border-left: 1px solid rgba(255,255,255,.35); line-height: 12px; padding: 2px 0 3px; }
  .trip .t2 span.route { white-space: normal; } /* 'EWR IND EWR' wraps in a narrow stop, and the row grows */
  .trip .t2 span:first-child { border-left: 0; }
  .trip.front { background: var(--front); color: #fff; }
  .trip.back { background: var(--back); color: #fff; }
  .trip.double { background: var(--double); color: #fff; }
  .trip.none { background: var(--none); }
  .trip.rsv { background: var(--rsv); color: #fff; }
  .trip .mdh { position: absolute; top: 0; bottom: 0; background: var(--mid); } /* the day of a mid-trip deadhead */
  .trip .t1, .trip .t2 { position: relative; } /* labels stay on top of .mdh */

  /* selected list */
  #sel { list-style: none; margin: 0; padding: 0; }
  #sel li { padding: 4px 0; border-top: 1px solid var(--line); background: #fff; }
  #sel li.line { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 6px; align-items: center; }
  #sel li.brk { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 12px; }
  #sel li.brk::before, #sel li.brk::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
  #sel li.brk .name { cursor: pointer; text-decoration: underline dotted; }
  #sel li.brk button, #sel li.line button { padding: 2px 6px; font-size: 12px; }
  #sel li.dim { opacity: .45; }
  .sortable-ghost { background: var(--sel) !important; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 3px; }

  dialog { border: 0; border-radius: 10px; padding: 0; max-width: min(96vw, 900px); width: 100%; }
  dialog .body { padding: 12px 16px; }
  dialog h3 { margin: 0 0 6px; }
  dialog table { border-collapse: collapse; font-size: 12px; width: 100%; }
  dialog td, dialog th { padding: 2px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  dialog tr.dh td { background: #eaf2fd; }
  dialog pre { font-size: 11px; overflow: auto; background: #f6f7f9; padding: 8px; max-height: 40vh; }
  dialog textarea { width: 100%; height: 40vh; font-family: ui-monospace, monospace; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; padding: 8px 16px 12px; }
</style>
</head>
<body>
<header>
  <h1>MattBid</h1>
  <select id="month" title="Stored months"></select>
  <button id="delMonth" title="Forget this month" hidden>✕</button>
  <button id="syncBtn" title="Keep your selections the same on your other devices">Sync</button>
  <button onclick="window.open('https://purpleid.okta.com/app/F5/exk4cmweutsCFl15s357/sso/saml','_blank')">Get bid pack</button>
  <input type="file" id="file" title="Import a bid package (.asc)">
  <label>DH city <input id="dhCity" maxlength="4" placeholder="ORD">
    <select id="dhMode"><option value="exclude">exclude</option><option value="only">only</option></select></label>
  <label>Days off <select id="daysOffMode"><option value="highlight">highlight</option><option value="hide">hide lines</option></select>
    <button id="clearDays">clear</button></label>
  <label>Sort <select id="sort"><option value="line">line #</option><option value="creditDesc">credit ↓</option><option value="creditAsc">credit ↑</option></select></label>
  <label><input type="checkbox" id="showReserve" checked> show reserve</label>
  <label><input type="checkbox" id="vto"> add 9952 (VTO)</label>
  <button id="export" class="primary">Export bid</button>
</header>

<main>
  <section id="selPanel" hidden>
    <h2>Selected <span id="selCount"></span></h2>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <button id="addBreak">+ tier break</button>
      <button id="clearSel">clear</button>
    </div>
    <div id="selHead"></div>
    <ul id="sel"></ul>
  </section>
  <section id="linesPanel">
    <div class="legend">
      <span><i style="background:var(--front)"></i>front DH</span>
      <span><i style="background:var(--back)"></i>back DH</span>
      <span><i style="background:var(--double)"></i>double DH</span>
      <span><i style="background:var(--none)"></i>no DH</span>
      <span><i style="background:var(--rsv)"></i>reserve</span>
      <span><i style="background:var(--mid)"></i>mid-trip DH day</span>
      <span><i style="background:var(--off)"></i>day off (tap a day in the header)</span>
      <span id="count"></span>
    </div>
    <div id="empty">Import a bid package (.asc) to begin.</div>
    <div id="lines"></div>
  </section>
</main>

<dialog id="syncDlg"><form method="dialog"><div class="body"><h3>Sync</h3><p id="syncInfo"></p>
  <input name="username" autocomplete="username" value="MattBid" hidden>
  <p id="syncSet"><label>Sync password <input type="password" id="syncPass" name="password" autocomplete="current-password" pattern=".{10,}" title="10 or more characters" required></label>
    <button value="on">Turn on sync</button></p>
  <p id="syncUnset"><button value="off" formnovalidate>Turn off sync</button></p></div>
  <div class="actions"><button value="" formnovalidate>Close</button></div></form></dialog>
<dialog id="tripDlg"><div class="body" id="tripBody"></div><div class="actions"><button onclick="tripDlg.close()">Close</button></div></dialog>
<dialog id="exportDlg"><div class="body"><h3>Bid</h3><textarea id="exportText" readonly></textarea></div>
  <div class="actions"><button id="copyBtn">Copy</button><button id="dlBtn">Download</button><button onclick="exportDlg.close()">Close</button></div></dialog>

<script src="vendor/Sortable.min.js"></script>
<script src="parse.js"></script>
<script>
const $ = s => document.querySelector(s);
let pkg = null;
const freshState = () => ({ selected: [], filters: { dhCity: '', dhMode: 'exclude', daysOff: [], daysOffMode: 'highlight' }, sort: 'line', showReserve: true, vto: false });
let state = freshState();

// ---------- per-month state (localStorage, small) ----------
const key = () => 'mattbid:' + (pkg ? pkg.title : '');
let savedJson = ''; // the state as last saved: updatedAt changes only when the state changes
function save() {
  const json = JSON.stringify({ ...state, updatedAt: 0 });
  if (json === savedJson) return;
  savedJson = json; state.updatedAt = Date.now();
  try { localStorage.setItem(key(), JSON.stringify(state)); } catch (e) {}
  syncSoon();
}
function load() {
  state = freshState();
  try { const s = localStorage.getItem(key()); if (s) Object.assign(state, JSON.parse(s)); } catch (e) {}
  savedJson = JSON.stringify({ ...state, updatedAt: 0 });
  $('#dhCity').value = state.filters.dhCity; $('#dhMode').value = state.filters.dhMode;
  $('#daysOffMode').value = state.filters.daysOffMode; $('#sort').value = state.sort;
  $('#showReserve').checked = state.showReserve; $('#vto').checked = state.vto;
}

// ---------- package store (IndexedDB, one record per month) ----------
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('mattbid', 2);
    r.onupgradeneeded = e => {
      const db = r.result;
      if (e.oldVersion < 1) db.createObjectStore('packages', { keyPath: 'title' });
      if (e.oldVersion < 2) db.createObjectStore('handles', { keyPath: 'key' }); // unused now; kept so browsers already on v2 don't hit a VersionError
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function store(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('packages', mode), req = fn(tx.objectStore('packages'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = tx.onabort = () => rej(tx.error || new Error('The storage transaction stopped.')); // a full disk aborts with no error event
  });
}
const pkgPut = rec => store('readwrite', s => s.put(rec));
const pkgGet = title => store('readonly', s => s.get(title));
const pkgAll = () => store('readonly', s => s.getAll());
const pkgDelete = title => store('readwrite', s => s.delete(title));

async function refreshMonths() {
  const all = (await pkgAll()).sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0));
  $('#month').innerHTML = all.map(r => {
    let n = 0; try { n = (JSON.parse(localStorage.getItem('mattbid:' + r.title) || '{}').selected || []).filter(s => s.t === 'line').length; } catch (e) {}
    return `<option value="${r.title}" ${pkg && r.title === pkg.title ? 'selected' : ''}>${r.title}${n ? ` · ${n} selected` : ''}</option>`;
  }).join('');
  $('#delMonth').hidden = !pkg;
}
function show(text) {
  pkg = parseAsc(text);
  $('#empty').hidden = true;
  load(); render();
  navigator.storage?.persist?.(); // ask the browser to keep the stored months (a Home Screen app gets it)
}
async function importText(text) {
  show(text);
  await pkgPut({ title: pkg.title, text, savedAt: Date.now(), openedAt: Date.now() });
  localStorage.setItem('mattbid:last', pkg.title);
  await refreshMonths();
}
async function openMonth(title) {
  const rec = await pkgGet(title); if (!rec) return;
  show(rec.text);
  rec.openedAt = Date.now(); await pkgPut(rec);
  localStorage.setItem('mattbid:last', title);
  refreshMonths();
}
const fail = err => alert(`MattBid could not open the package: ${err.message}`);
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) f.text().then(importText).catch(fail); e.target.value = ''; });
$('#month').onchange = e => openMonth(e.target.value).catch(fail);
$('#delMonth').onclick = async () => {
  if (!pkg || !confirm(`Forget ${pkg.title} and its selections?`)) return;
  await pkgDelete(pkg.title); localStorage.removeItem(key()); localStorage.removeItem('mattbid:last');
  pkg = null; $('#lines').innerHTML = ''; $('#empty').hidden = false; $('#selPanel').hidden = true; $('#count').textContent = '';
  refreshMonths();
};

// ---------- helpers ----------
const lineByNum = n => pkg.lines.find(l => l.num === n);
const fmtDay = iso => String(new Date(iso + 'T00:00').getDate()); // weekends are shaded, so the number is enough
const isWknd = iso => [0, 6].includes(new Date(iso + 'T00:00').getDay());
function lineCities(line) { return new Set(line.trips.flatMap(t => t.dhCities)); }
function lineWorkDays(line) { const s = new Set(); line.trips.forEach(t => { for (let i = t.startIdx; i <= t.endIdx; i++) s.add(i); }); return s; }
function passes(line) {
  const f = state.filters, city = f.dhCity.trim().toUpperCase();
  if (line.reserve && !state.showReserve) return false;
  if (city) { const has = lineCities(line).has(city); if (f.dhMode === 'exclude' ? has : !has) return false; }
  if (f.daysOffMode === 'hide' && f.daysOff.length) { const w = lineWorkDays(line); if (f.daysOff.some(d => w.has(d))) return false; }
  return true;
}
function sorted(lines) {
  const l = lines.slice(), m = x => x.credit ? toMinutes(x.credit) : 0;
  if (state.sort === 'creditDesc') l.sort((a, b) => m(b) - m(a));
  if (state.sort === 'creditAsc') l.sort((a, b) => m(a) - m(b));
  return l;
}

// ---------- rendering ----------
function barHtml(line, header) {
  const n = pkg.days.length, off = new Set(state.filters.daysOff);
  let h = `<div class="bar" style="--n:${n}">`;
  pkg.days.forEach((d, i) => {
    const cls = ['d', isWknd(d) && 'wknd', off.has(i) && 'off', header && d > pkg.period.end && 'pend'].filter(Boolean).join(' ');
    h += `<div class="${cls}" style="grid-column:${i + 1}" data-i="${i}">${header ? fmtDay(d) : ''}</div>`;
  });
  if (line) line.trips.forEach((t, ti) => {
    const cls = ['trip', t.reserve ? 'rsv' : t.dhKind].join(' ');
    const w = t.endIdx - t.startIdx + 1, top = t.reserve ? `Reserve ${t.letter}` : `${t.pairingNum} · ${t.credit}`;
    h += `<div class="${cls}" style="grid-column:${t.startIdx + 1}/${t.endIdx + 2}" data-line="${line.num}" data-trip="${ti}" title="${top}">`;
    h += (t.midDhDays || []).map(d => `<i class="mdh" style="left:${(d - t.startIdx) * 100 / w}%;width:${100 / w}%"></i>`).join('');
    h += `<div class="t1">${top}</div><div class="t2" style="--w:${w}">` +
      (t.stops || []).map(s => `<span${s.label.includes(' ') ? ' class="route"' : ''} style="grid-column:span ${s.endIdx - s.startIdx + 1}">${s.label}</span>`).join('') + '</div></div>';
  });
  return h + '</div>';
}
function metaHtml(line, checkbox) {
  const l2 = line.reserve ? `reserve ${line.letter} · RLG ${line.credit}` : `CR ${line.credit} · TAFB ${line.tafb}`;
  const l3 = line.reserve ? `${line.daysOff} off` : `${line.daysOff} off · ${line.trips.length} trip${line.trips.length === 1 ? '' : 's'}`;
  return `<div class="meta">${checkbox ? `<input type="checkbox" data-num="${line.num}">` : ''}<b>${line.num}</b>${line.flag}
    <small>${l2}</small><small>${l3}</small></div>`;
}
const headRow = () => `<div class="row head"><div class="meta">line</div>${barHtml(null, true)}</div>`;
function render() {
  if (!pkg) return;
  // A selected line shows only in Selected. Its ✕ button moves it back to this list.
  const sel = new Set(state.selected.map(s => s.num)), rest = pkg.lines.filter(l => !sel.has(l.num));
  const visible = sorted(rest.filter(passes)), w = pkg.warnings.length;
  $('#count').textContent = `${visible.length} / ${rest.length} shown` + (w ? ` · ⚠ ${w} parse warning${w === 1 ? '' : 's'} (tap)` : '');
  $('#lines').innerHTML = headRow() + visible.map(l => `<div class="row">${metaHtml(l, true)}${barHtml(l)}</div>`).join('');
  renderSel();
  save();
}
function renderSel() {
  let tier = 1;
  $('#sel').innerHTML = state.selected.map((s, i) => {
    if (s.t === 'break') return `<li class="brk" data-i="${i}"><span class="name" data-name="${i}">${s.name || 'Tier ' + (++tier)}</span> <button data-rm="${i}">✕</button></li>`;
    const l = lineByNum(s.num);
    // A new import of the month can remove a selected line. Show it, because the export still has it.
    if (!l) return `<li class="line dim" data-i="${i}"><div class="meta"><b>${s.num}</b><small>not in this package</small></div><div></div><button data-rm="${i}">✕</button></li>`;
    return `<li class="line ${passes(l) ? '' : 'dim'}" data-i="${i}" data-num="${l.num}">${metaHtml(l)}${barHtml(l)}<button data-rm="${i}">✕</button></li>`;
  }).join('');
  const n = state.selected.filter(s => s.t === 'line').length, tiers = state.selected.filter(s => s.t === 'break').length + 1;
  $('#selPanel').hidden = state.selected.length === 0;
  $('#selHead').innerHTML = state.selected.length ? headRow() : '';
  $('#selCount').textContent = n ? `(${n} line${n === 1 ? '' : 's'}, ${tiers} tier${tiers === 1 ? '' : 's'})` : '';
}
new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('header').offsetHeight + 'px')).observe($('header'));

// ---------- interactions ----------
function onDayOrTrip(e) {
  const trip = e.target.closest('.trip'); if (trip) return showTrip(+trip.dataset.line, +trip.dataset.trip);
  const day = e.target.closest('.head .d'); if (day) return toggleDay(+day.dataset.i);
}
$('#lines').addEventListener('click', onDayOrTrip);
$('#count').onclick = () => { if (pkg && pkg.warnings.length) alert(pkg.warnings.join('\n')); };
$('#selHead').addEventListener('click', onDayOrTrip);
$('#lines').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
  state.selected.push({ t: 'line', num: +cb.dataset.num });
  render(); // the line moves from this list to Selected
});
$('#sel').addEventListener('click', e => {
  const nm = e.target.closest('[data-name]');
  if (nm) { const b = state.selected[+nm.dataset.name], v = prompt('Tier name', b.name || nm.textContent); if (v !== null) { b.name = v.trim(); renderSel(); save(); } return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { state.selected.splice(+rm.dataset.rm, 1); render(); return; }
  onDayOrTrip(e);
});
// If vendor/Sortable.min.js does not load, drag is off and the rest of the app works.
if (window.Sortable) Sortable.create($('#sel'), { animation: 120, delay: 120, delayOnTouchOnly: true, onEnd() {
  const order = [...$('#sel').children].map(li => state.selected[+li.dataset.i]);
  state.selected = order; renderSel(); save();
} });
$('#addBreak').onclick = () => { state.selected.push({ t: 'break' }); renderSel(); save(); };
$('#clearSel').onclick = () => { if (confirm('Clear the selected list?')) { state.selected = []; render(); } };
function toggleDay(i) {
  const d = state.filters.daysOff, k = d.indexOf(i);
  k >= 0 ? d.splice(k, 1) : d.push(i);
  render();
}
$('#clearDays').onclick = () => { state.filters.daysOff = []; render(); };
$('#dhCity').oninput = e => { state.filters.dhCity = e.target.value; render(); };
$('#dhMode').onchange = e => { state.filters.dhMode = e.target.value; render(); };
$('#daysOffMode').onchange = e => { state.filters.daysOffMode = e.target.value; render(); };
$('#sort').onchange = e => { state.sort = e.target.value; render(); };
$('#showReserve').onchange = e => { state.showReserve = e.target.checked; render(); };
$('#vto').onchange = e => { state.vto = e.target.checked; render(); };

function showTrip(lineNum, ti) {
  const t = lineByNum(lineNum).trips[ti], p = t.pairing;
  let h;
  if (t.reserve) h = `<h3>Line ${lineNum} · Reserve ${t.letter} · ${pkg.days[t.startIdx]} → ${pkg.days[t.endIdx]}</h3>`;
  else {
    h = `<h3>Line ${lineNum} · Pairing ${t.pairingNum} · ${pkg.days[t.startIdx]} → ${pkg.days[t.endIdx]}</h3>`;
    if (!p) h += '<p>Pairing details not found in the package.</p>';
    else {
      h += `<p>Report ${p.report}Z (${p.reportLocal} LT) · ${p.effective.text} · ${p.crew}<br>Credit ${p.credit}${p.creditT ? 'T' : ''} · Block ${p.blk} · ${p.ldgs} ldgs · TAFB ${p.tafb} · DH: ${t.dhKind}${t.midDh ? ' + mid-trip' : ''}</p>`;
      h += '<table><tr><th>Day</th><th>Flt</th><th>Eqp</th><th>Dep</th><th>Arr</th><th>Blk</th><th></th></tr>' +
        p.legs.map(l => `<tr class="${l.dh ? 'dh' : ''}"><td>${l.day}</td><td>${l.flt}</td><td>${l.eqp}</td><td>${l.dep} ${l.depZ} (${l.depL})</td><td>${l.arr} ${l.arrZ} (${l.arrL})</td><td>${l.blk}</td><td>${l.dh ? 'DH' : ''} ${l.flags}</td></tr>`).join('') + '</table>';
      if (p.hotels.length) h += '<p>' + p.hotels.map(x => `${x.layover}: ${x.name}`).join('<br>') + '</p>';
      h += `<pre>${p.raw.replace(/</g, '&lt;')}</pre>`;
    }
  }
  $('#tripBody').innerHTML = h; tripDlg.showModal();
}

// ---------- export ----------
// The bid form has one box per line number, 5 across, where you type your rank for that line.
// So the export is grids of ranks (1 = top choice), one grid per thousand block (1001 -> slot 001 of block 1), tab-separated, blank = not bid.
function bidText() {
  const nums = state.selected.filter(s => s.t === 'line').map(s => s.num);
  const rank = new Map(nums.map((n, i) => [n, i + 1]));
  const top = new Map(); // block -> highest slot, from the package and from the picks
  for (const n of [...(pkg ? pkg.lines.map(l => l.num) : []), ...nums]) top.set(n / 1000 | 0, Math.max(top.get(n / 1000 | 0) || 0, n % 1000));
  const grids = [...top].sort((a, b) => a[0] - b[0]).map(([b, max]) => {
    const rows = [];
    for (let s = 1; s <= max; s += 5) rows.push(Array.from({ length: 5 }, (_, c) => rank.get(b * 1000 + s + c) ?? '').join('\t'));
    return rows.join('\n');
  });
  if ($('#vto').checked) grids.push(`9952\t${nums.length + 1}`);
  return grids.join('\n\n');
}
$('#export').onclick = () => { $('#exportText').value = bidText(); $('#copyBtn').textContent = 'Copy'; exportDlg.showModal(); };
$('#copyBtn').onclick = () => navigator.clipboard.writeText(bidText()).then(() => $('#copyBtn').textContent = 'Copied', () => alert('Copy failed; select the text and copy manually.'));
function download(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  // In the Home Screen app, the share sheet ('Save to Files') is the documented way to save a file.
  if ((navigator.standalone || matchMedia('(display-mode: standalone)').matches) && navigator.canShare?.({ files: [file] })) {
    navigator.share({ files: [file] }).catch(err => { if (err.name !== 'AbortError') alert(`Could not save the file: ${err.message}`); });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
$('#dlBtn').onclick = () => download(new Blob([bidText()], { type: 'text/plain' }), `bid-${(pkg && pkg.title || 'mattbid').replace(/\W+/g, '-')}.txt`);

// ---------- sync: each device with the same sync code gets the newest state of each month ----------
const SYNC_URL = 'https://mattbid-sync.mattbid-sync.workers.dev/s/';
const syncKey = () => localStorage.getItem('mattbid:sync');
let syncTimer;
function syncSoon() { if (syncKey()) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 2000); } }
/** Send the state of each stored month. The server keeps the newest state of each month and returns them all. */
async function sync() {
  const k = syncKey(); if (!k) return renderSync();
  const months = {};
  for (let i = 0; i < localStorage.length; i++) {
    const name = localStorage.key(i), title = name.slice('mattbid:'.length);
    if (!name.startsWith('mattbid:') || ['last', 'sync', 'asc'].includes(title)) continue;
    // A state from before sync has no updatedAt. Send it as 0: the server keeps it only if it has no copy.
    try { const s = JSON.parse(localStorage.getItem(name)); months[title] = { updatedAt: s.updatedAt || 0, state: s }; } catch (e) {}
  }
  try {
    const res = await fetch(SYNC_URL + k, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ months }) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    let reload = false;
    for (const [title, m] of Object.entries((await res.json()).months)) {
      const local = months[title];
      // Keep the local state if it is as new. A local state with no updatedAt gives way to a different server copy.
      if (local && (local.updatedAt ? m.updatedAt <= local.updatedAt : JSON.stringify(m.state) === JSON.stringify(local.state))) continue;
      localStorage.setItem('mattbid:' + title, JSON.stringify(m.state));
      if (pkg && title === pkg.title) reload = true;
    }
    if (reload) { load(); render(); }
    renderSync('✓');
  } catch (e) { renderSync('⚠'); } // no network: the next change, launch, or 'online' event tries again
}
function renderSync(mark = '') {
  const k = syncKey();
  $('#syncBtn').textContent = k ? `Sync ${mark}`.trim() : 'Sync';
  $('#syncInfo').textContent = k ? 'Sync is on. Use the same password on your other devices.'
    : 'Sync is off. Your selections stay on this device. To sync, use the same password (10 or more characters) on each device.';
  $('#syncSet').hidden = !!k; $('#syncUnset').hidden = !k;
}
/** The sync code for a password: SHA-256, as base64url. The same password gives the same code on each device. */
async function syncKeyFor(password) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mattbid-sync:' + password));
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
$('#syncBtn').onclick = () => { renderSync(); syncDlg.showModal(); };
// A form submit closes the dialog, so a password manager can offer to save the password.
syncDlg.onclose = async () => {
  if (syncDlg.returnValue === 'on') { localStorage.setItem('mattbid:sync', await syncKeyFor($('#syncPass').value)); sync(); }
  if (syncDlg.returnValue === 'off') { localStorage.removeItem('mattbid:sync'); renderSync(); }
  $('#syncPass').value = '';
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
addEventListener('online', sync);

// ---------- startup: migrate the v0 single-package key, then open the last month ----------
(async () => {
  let old = null; try { old = localStorage.getItem('mattbid:asc'); } catch (e) {}
  if (old) { await importText(old); localStorage.removeItem('mattbid:asc'); return; }
  const last = localStorage.getItem('mattbid:last');
  if (last) await openMonth(last);
})().catch(fail).finally(() => { refreshMonths(); sync(); }); // refreshMonths also fills the list when the last month is gone
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); // offline launch
</script>
